name: CI

# Runs on every push to main, every push to a working branch, and every pull
# request, so a broken change is caught automatically instead of by hand.
# - backend: syntax + boot + HTTP smoke tests + unit tests (scripts/*.mjs)
# - app: `flutter analyze` on the patient app, so the Flutter code can't drift
#   into a broken state between (toolchain-less) editing sessions.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned on purpose. A floating "stable" turned this check red
          # overnight: Flutter 3.50 marks package:flutter/material.dart as
          # deprecated (it wants package:material_ui), which is 19 info-level
          # notices, and `flutter analyze` fails on any notice. Move to a newer
          # Flutter deliberately, together with that import change.
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
