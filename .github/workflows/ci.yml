name: CI

# Runs on every push to main and every pull request, so a broken change is
# caught automatically instead of by hand. See scripts/ci-check.mjs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
