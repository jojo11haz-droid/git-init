name: App build

# Builds the patient app into files people can install.
# - Android: an installable .apk (download it from this run's "Artifacts").
#   With the Play Store upload key in the repository secrets
#   (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   ANDROID_STORE_PASSWORD) it is signed with that key, and a Play Store
#   bundle (.aab) is built too. Without them it is signed with a debug key:
#   fine for testing on your own phone, not for the Play Store.
# - iOS: only when started by hand (Actions > App build > Run workflow); it
#   checks the iPhone build compiles. Publishing to the App Store needs an
#   Apple developer account and signing, done from Xcode or App Store Connect.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['patient_app/**', '.github/workflows/app-build.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9' # same pin as ci.yml
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Play Store signing key (only if the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/key.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No upload key in the secrets: the .apk is debug-signed (for testing)."
          fi
      - run: flutter build apk --release
      - run: flutter build appbundle --release
        if: env.SIGNED == '1'
      - uses: actions/upload-artifact@v4
        with:
          name: between-android-apk
          path: patient_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == '1'
        with:
          name: between-android-play-bundle
          path: patient_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: patient_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
