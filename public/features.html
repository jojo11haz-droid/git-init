    sel.innerHTML = Object.keys(FIELDS).map(function(k){ return '<option value="' + k + '"' + (k === fk ? ' selected' : '') + '>' + esc(FIELDS[k][lang][0]) + '</option>'; }).join('');
    var html = '', toc = '', total = 0, U = UNITS[lang];
    L.sections.forEach(function(sec){
      var icons = ITEM_IC[sec.id] || [];
      var items = sec.items.map(function(it, i){ return [it, icons[i]]; }).filter(function(p){ return p[0][2] !== 'body' || F.body; });
      total += items.length;
      var more = MORE[sec.id] ? '<a class="more" href="' + MORE[sec.id][lang][1] + '">' + esc(MORE[sec.id][lang][0]) + '</a>' : '';
      toc += '<a href="#' + sec.id + '" class="s-' + sec.id + '" data-sec="' + sec.id + '"><i></i>' + esc(fill(sec.h, w)) + '<small>' + items.length + '</small></a>';
      html += '<section id="' + sec.id + '" class="s-' + sec.id + '"><div class="sh"><span class="sic">' + svg(SEC_IC[sec.id], 22) + '</span><div><h2>' + esc(fill(sec.h, w)) + '</h2><p class="sub">' + esc(fill(sec.sub, w)) + '</p>' + more + '</div>'
        + '<span class="cnt">' + items.length + ' ' + (items.length === 1 ? U[0] : U[1]) + '</span></div><div class="grid">'
        + items.map(function(p){
            var it = p[0];
            var tag = it[2] === 'ai' ? '<span class="tag ai">' + esc(L.ai) + '</span>' : it[2] === 'prem' ? '<span class="tag prem">' + esc(L.prem) + '</span>' : '';
            return '<div class="f"><div class="fh"><span class="ic">' + svg(p[1], 18) + '</span>' + tag + '</div><h3>' + esc(fill(it[0], w)) + '</h3><p>' + esc(fill(it[1], w)) + '</p></div>';
          }).join('') + '</div></section>';
    });
    document.getElementById('sections').innerHTML = html;
    document.getElementById('toc').innerHTML = toc;
    document.getElementById('stats').innerHTML = '<span><b>' + total + '</b> ' + U[1] + '</span><span><b>' + L.sections.length + '</b> ' + U[2] + '</span><span>' + U[3] + '</span>';
    watchSections();
  }
  // Highlight the section in view in the pinned bar, and keep its chip
  // visible when the bar scrolls sideways on a phone.
  var _obs = null;
  function setActive(id){
    var bar = document.getElementById('toc');
    bar.querySelectorAll('a').forEach(function(a){
      var on = a.dataset.sec === id; a.classList.toggle('on', on);
      if(on){ a.setAttribute('aria-current', 'true'); var l = a.offsetLeft - 18; if(l < bar.scrollLeft || a.offsetLeft + a.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollTo({ left: l, behavior: 'smooth' }); }
      else a.removeAttribute('aria-current');
    });
  }
  function watchSections(){
    if(!('IntersectionObserver' in window)) return;
    if(_obs) _obs.disconnect();
    var seen = {};
    _obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ seen[e.target.id] = e.isIntersecting; });
      var first = null; document.querySelectorAll('#sections section').forEach(function(s){ if(!first && seen[s.id]) first = s.id; });
      if(first) setActive(first);
    }, { rootMargin: '-72px 0px -55% 0px' });
    document.querySelectorAll('#sections section').forEach(function(s){ _obs.observe(s); });
  }
  (function(){
    var bar = document.getElementById('toc');
    var mark = function(){ var top = bar.getBoundingClientRect().top; bar.classList.toggle('stuck', top <= 0.5 && window.scrollY > 0); };
    window.addEventListener('scroll', mark, { passive: true }); mark();
  })();
  function syncUrl(){
    var u = new URL(location.href); u.searchParams.set('field', SLUG[fk]); u.searchParams.set('lang', lang);
    try { history.replaceState(null, '', u.pathname + '?' + u.searchParams.toString() + location.hash); } catch(e){}
  }
  sel.addEventListener('change', function(){ fk = sel.value; render(); syncUrl(); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.addEventListener('click', function(){ lang = b.dataset.lang; try { localStorage.setItem('btw_lang', lang); } catch(e){} render(); syncUrl(); }); });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  render();
})();
</script>
</body>
</html>
